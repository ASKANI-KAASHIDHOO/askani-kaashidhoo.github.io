<!doctype html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>އަސްކަނި ކާށިދޫ | ދައުރާ އަދި ދަރުސް</title>
  <meta name="description" content="އަސްކަނި ކާށިދޫގެ ދައުރާތަކާއި ދަރުސްތަކުގެ ރެކޯޑު">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <meta name="theme-color" content="#4b3bb0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <header class="hero">
    <div class="container">
      <p class="bismillah" lang="ar">بسم الله الرحمن الرحيم</p>
      <img class="logo" src="images/logo-white.png" alt="އަސްކަނި ކާށިދޫގެ ލޯގޯ" width="150" height="150">
      <h1>އަސްކަނި ކާށިދޫ</h1>

      <div class="stats">
        <div class="stat"><span class="num" id="stat-dhauraa">0</span><span>ދައުރާ</span></div>
        <div class="stat"><span class="num" id="stat-dharus">0</span><span>ދަރުސް</span></div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-type="all">ހުރިހާ</button>
        <button class="tab" data-type="dhauraa">ދައުރާ</button>
        <button class="tab" data-type="dharus">ދަރުސް</button>
      </div>
      <div class="filters">
        <select id="year" aria-label="އަހަރު">
          <option value="all">ހުރިހާ އަހަރެއް</option>
        </select>
        <input id="search" type="search" placeholder="ހޯދާ..." aria-label="ހޯދާ">
      </div>
    </div>

    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden>އެއްވެސް ރެކޯޑެއް ނުފެނުނު</p>
  </main>

  <dialog id="detail">
    <article>
      <button class="close" id="close" aria-label="ބަންދުކުރޭ">✕</button>
      <span class="badge" id="d-type"></span>
      <h2 id="d-title"></h2>
      <p class="ar-text" id="d-arabic" lang="ar" dir="rtl"></p>
      <dl id="d-fields"></dl>
      <div id="d-desc" class="desc"></div>
    </article>
  </dialog>

  <footer class="footer">
    <div class="container">© <span id="year-now">2026</span> އަސްކަނި ކާށިދޫ</div>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
